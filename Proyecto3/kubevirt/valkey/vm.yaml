apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: valkey-vm
  namespace: py3-202102140
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app: valkey
    spec:
      domain:
        devices:
          disks:
            - name: containerdisk
              disk:
                bus: virtio
            - name: datadisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
        resources:
          requests:
            memory: 1Gi
      networks:
        - name: default
          pod: {}
      volumes:
        - name: containerdisk
          containerDisk:
            image: quay.io/kubevirt/alpine-container-disk-demo:devel
        - name: datadisk
          persistentVolumeClaim:
            claimName: valkey-data-pvc
